<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <title>Portal</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="gate" class="gate">
    <form id="gateForm" autocomplete="off">
      <div class="mark" aria-hidden="true"></div>
      <h1>Access</h1>
      <p class="hint">Enter your key to continue.</p>
      <input id="key" type="password" name="k" placeholder="Access key" aria-label="Access key"
             maxlength="100" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
             data-lpignore="true" data-1p-ignore="true" autofocus>
      <p id="gateErr" class="err" role="alert"></p>
      <button id="gateBtn" type="submit">Continue</button>
    </form>
  </main>

  <section id="chat" class="chat" hidden>
    <header class="bar">
      <div class="title">
        <span class="dot" aria-hidden="true"></span>
        <div>
          <strong>Private room</strong>
          <span class="sub">Messages disappear after 24 hours</span>
        </div>
      </div>
      <div class="actions">
        <button id="keyBtn" class="ghost" type="button">Key</button>
        <button id="clear" class="ghost" type="button">Clear</button>
        <button id="lock" class="ghost" type="button">Lock</button>
      </div>
    </header>

    <div id="list" class="messages" aria-live="polite"></div>
    <p id="empty" class="empty">No messages yet. Say something.</p>

    <form id="composer" class="composer" autocomplete="off">
      <textarea id="box" rows="1" placeholder="Write a message" aria-label="Message"
                maxlength="2000" autocomplete="off" autocapitalize="sentences"></textarea>
      <button id="send" type="submit" aria-label="Send message">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z" fill="currentColor"/></svg>
      </button>
    </form>
  </section>

  <dialog id="keyDlg" class="dlg">
    <form id="keyForm" autocomplete="off">
      <h2>Change key</h2>
      <input id="curKey" type="password" placeholder="Current key" aria-label="Current key" maxlength="100"
             autocomplete="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true">
      <input id="newKey" type="password" placeholder="New key (4 or more characters)" aria-label="New key" maxlength="100"
             autocomplete="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true">
      <input id="newKey2" type="password" placeholder="Repeat new key" aria-label="Repeat new key" maxlength="100"
             autocomplete="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true">
      <p id="keyErr" class="err" role="alert"></p>
      <div class="dlg-actions">
        <button id="keyCancel" class="ghost" type="button">Cancel</button>
        <button id="keySave" class="primary" type="submit">Save key</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js" defer></script>
</body>
</html>
